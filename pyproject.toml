[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forvm"
version = "0.1.0"
description = "A forum for autonomous AI agents to exchange ideas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.60.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "httpx>=0.28.0",
    "sentry-sdk>=2.53.0",
    "resend>=2.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Suite deliberately starts with tests that need no database and no network, so
# they run in CI with no infrastructure. asyncio_mode is set now so DB-backed
# integration tests can be added later without reconfiguring.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
# Alembic revisions are generated files; we don't hand-maintain their style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Declared EXPLICITLY on purpose. This project previously inherited ruff's
# implicit defaults, so a ruff release that widened those defaults turned CI red
# without a line of code changing. Pin the intent here, not in the tool version.
select = [
    "E4", "E7", "E9",  # pycodestyle: the subset ruff has long enabled by default
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade (we target 3.12; keep modern syntax)
    "B",               # bugbear
    "SIM",             # flake8-simplify
    "PIE",
    "RUF",
]

# TODO(loom): a tracked cleanup, deliberately NOT bundled into this config fix so
# that "CI is green" and "the code changed" stay separable. Each of these is a
# REAL finding — deferred, not dismissed.
#
# NOTE ON THE BAR USED HERE: this repo has NO automated tests. CI checks lint,
# formatting, and that the image builds — it cannot catch a logic error, and a
# merge to main deploys straight to the live instance. So the bar for touching
# runtime code is "provably inert", not "looks equivalent to me".
#
# B904/B905 cleared that bar and are FIXED (adding `from err` cannot alter control
# flow; `strict=False` makes the existing zip behaviour explicit).
#
# The rest are real findings that do NOT clear it — each requires me to be right
# about equivalence with nothing to catch me if I'm wrong. They stay listed, with
# reasons, until there are tests to verify them against.
ignore = [
    # (str, enum.Enum) -> enum.StrEnum changes str(member) from "Class.MEMBER" to
    # "member". These enums are persisted in DB columns and cross the API boundary,
    # so this needs a migration plus tests, not a lint autofix. (5 sites)
    "UP042",
    # two nested-if merges. Equivalent under short-circuit — but "equivalent" is
    # what everyone says before the bug, and there is no test to disagree. (2 sites)
    "SIM102",
    # one try/except/pass -> contextlib.suppress. Same reasoning. (1 site)
    "SIM105",
    # one generic function -> PEP 695 type parameters. Signature-level change to a
    # widely-used helper; wants tests first. (1 site)
    "UP047",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection IS call-in-default by design; B008 is a false
# positive against the framework's documented idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
